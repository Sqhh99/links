name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_version: "6.8.3"
            qt_arch: win64_msvc2022_64
            sdk_arch: x64
            recording_enabled: "ON"
          - os: ubuntu-latest
            qt_version: "6.8.3"
            qt_arch: linux_gcc_64
            sdk_arch: x64
            recording_enabled: "OFF"
          - os: macos-15-intel
            qt_version: "6.8.3"
            qt_arch: clang_64
            sdk_arch: x64
            recording_enabled: "OFF"

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # core/ must never depend on Qt. links_core and links_core_base link no
    # Qt6::* target, so a Qt include there is already a compile error -- this
    # check just fails faster and with a clearer message. It also catches the
    # Qt keyword macros (emit/signals/slots), which would not fail to compile
    # but would silently break any translation unit that also includes Qt.
    - name: Check core is Qt-free
      shell: bash
      run: |
        set -e
        hits=$(grep -rnE '#include *[<"]Q[A-Za-z]|Q_OBJECT|Q_DECLARE_METATYPE' \
                 --include='*.h' --include='*.cpp' --include='*.mm' core/ || true)
        if [ -n "$hits" ]; then
          echo "Qt dependency found in core/:"
          echo "$hits"
          exit 1
        fi
        kw=$(grep -rnE '^[^/*]*\b(emit|signals|slots)\b *[({:]' \
               --include='*.h' --include='*.cpp' core/ || true)
        if [ -n "$kw" ]; then
          echo "Qt keyword macro used as an identifier in core/:"
          echo "$kw"
          exit 1
        fi
        deps=$(grep -rn '#include ".*utils/' --include='*.h' --include='*.cpp' core/ || true)
        if [ -n "$deps" ]; then
          echo "core/ must not depend on utils/ (that layer is Qt):"
          echo "$deps"
          exit 1
        fi
        echo "OK: core/ is Qt-free"

    # Install Qt
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_version }}
        arch: ${{ matrix.qt_arch }}
        modules: qtmultimedia
        cache: true

    # Install Ninja
    - name: Install Ninja (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja

    - name: Install Ninja (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Install Ninja (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    # Linux-specific dependencies
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libxcb-xinerama0-dev \
          libxcb-cursor-dev \
          libpulse-dev \
          libasound2-dev

    # Setup MSVC (Windows only)
    - name: Setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    # Setup vcpkg
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git third_party/vcpkg
      
    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics

    - name: Bootstrap vcpkg (Unix)
      if: runner.os != 'Windows'
      run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

    # Cache vcpkg packages
    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: third_party/vcpkg_installed
        key: vcpkg-${{ runner.os }}-${{ matrix.sdk_arch }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.sdk_arch }}-

    # Build + Test via repo scripts
    - name: Build and Test (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      env:
        LINKS_SDK_ARCH: ${{ matrix.sdk_arch }}
        LINKS_ENABLE_LOCAL_RECORDING: ${{ matrix.recording_enabled }}
      run: build.cmd test

    - name: Build and Test (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        LINKS_SDK_ARCH: ${{ matrix.sdk_arch }}
        LINKS_ENABLE_LOCAL_RECORDING: ${{ matrix.recording_enabled }}
      run: |
        chmod +x ./build.sh
        ./build.sh test

    # Upload build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: links-${{ runner.os }}
        path: build/bin/
        retention-days: 7
